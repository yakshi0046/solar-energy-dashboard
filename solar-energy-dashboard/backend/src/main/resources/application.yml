server:
  port: ${PORT:8080}
spring:
  application:
    name: solar-dashboard-api
  datasource:
    url: jdbc:h2:mem:solar;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    days: 7
management:
  endpoints:
    web:
      exposure:
        include: health
